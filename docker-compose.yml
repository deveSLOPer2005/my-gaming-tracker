version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: my_gaming_app

    volumes:
      - .:/var/www
    networks:
      - gaming_network

  web:
    image: nginx:alpine
    container_name: my_gaming_web

    ports:
      - '80:80'
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gaming_network

networks:
  gaming_network:
    driver: bridge
